services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - appnet

  agent-server:
    build:
      context: ../services/agent-server
      dockerfile: ./infra/Dockerfile
    env_file:
      - ./.env            # общий .env для всех сервисов
      - ./agent.env       # доп-переменные/оверрайды агента (опц.)
    environment:
      NODE_ENV: production
      TZ: Europe/Belgrade
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      MEM_WINDOW_SIZE: 15
      HANDLE_TTL_SECONDS: 7200
      # LLM defaults (можно задать в .env)
      LLM_MODEL: ${LLM_MODEL:-gpt-5-thinking}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"       # удобно для /health в отладке; в проде можно убрать
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - appnet

